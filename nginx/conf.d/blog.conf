# Z-blog 展示端（NPM 代理到 :8080，SSL 由 NPM 处理）
server {
    listen 80;
    server_name wuzhispace.com www.wuzhispace.com;

    root  /usr/share/nginx/blog;
    index index.html;
    client_max_body_size 12m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

    # API 反代到宿主机 Go 进程
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location = /health {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
