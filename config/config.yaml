# Z-blog 生产环境配置模板
# 复制为 config.yaml 并填入真实值，chmod 600
# 此文件放置在 /opt/zblog/config.yaml，由宿主机上 systemd 管理的 Go 二进制直接读取

app:
  name: blog-admin
  version: 0.0.1
  mode: release
  port: 3000

database:
  driver: postgres
  host: 127.0.0.1         # 服务器已有的 PostgreSQL
  port: 5432
  user: postgres          # 与 .env POSTGRES_USER 一致
  password: wz@123     # 与 .env POSTGRES_PASSWORD 一致
  dbname: zblog            # 与 .env POSTGRES_DB 一致
  max_idle_conns: 5       # 2C4G 环境下调小
  max_open_conns: 30      # 原 100 对 2C4G 过大
  conn_max_lifetime: 1800

redis:
  addr: 127.0.0.1:6379     # 服务器已有的 Redis
  password: w123#abc     # 与 .env REDIS_PASSWORD 一致
  db: 3
  pool_size: 10
  min_idle_conns: 2

jwt:
  secret: 9cdd7903862f4cc4e54ff5b225b42abe2063214f21aec2aa070e6d9d9ca5b27d       # 必须替换！运行: openssl rand -hex 32
  expire: 24
  prefix: blog_

swagger:
  enabled: false          # 生产必须关闭！
  host: ""
  base_path: /api

log:
  level: info
  file_path: ""           # 日志走 stdout，由 systemd journald 管理
  max_size: 100
  max_backups: 3

migration:
  dir: ./migrations       # 相对于 systemd WorkingDirectory /opt/zblog

elasticsearch:
  addresses: ["http://es:9200"]  # 一期不部署 ES，连不上会自动降级
  index_prefix: "zblog"
  username: ""
  password: ""
