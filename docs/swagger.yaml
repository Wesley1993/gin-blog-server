basePath: /
definitions:
  dto.CreateArticleReq:
    properties:
      category_id:
        type: integer
      content:
        type: string
      cover:
        type: string
      status:
        type: integer
      tags:
        type: string
      title:
        type: string
    required:
    - category_id
    - content
    - title
    type: object
  dto.CreateCategoryReq:
    properties:
      name:
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        type: integer
    required:
    - name
    type: object
  dto.CreateRoleReq:
    properties:
      button_perms:
        description: 按钮权限标识数组
        items:
          type: string
        type: array
      menu_ids:
        description: 菜单ID数组
        items:
          type: integer
        type: array
      role_name:
        type: string
    required:
    - role_name
    type: object
  dto.CreateUserReq:
    properties:
      nickname:
        type: string
      password:
        type: string
      role_id:
        type: integer
      status:
        type: integer
      username:
        type: string
    required:
    - password
    - role_id
    - username
    type: object
  dto.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResp:
    properties:
      token:
        type: string
    type: object
  dto.ResetPwdReq:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  dto.UpdateArticleReq:
    properties:
      category_id:
        type: integer
      content:
        type: string
      cover:
        type: string
      id:
        type: integer
      status:
        type: integer
      tags:
        type: string
      title:
        type: string
    required:
    - category_id
    - content
    - id
    - title
    type: object
  dto.UpdateCategoryReq:
    properties:
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        type: integer
    required:
    - id
    - name
    type: object
  dto.UpdateRoleReq:
    properties:
      button_perms:
        description: 按钮权限标识数组
        items:
          type: string
        type: array
      id:
        type: integer
      menu_ids:
        description: 菜单ID数组
        items:
          type: integer
        type: array
      role_name:
        type: string
    required:
    - id
    - role_name
    type: object
  dto.UpdateUserReq:
    properties:
      id:
        type: integer
      nickname:
        type: string
      role_id:
        type: integer
      status:
        type: integer
    required:
    - id
    type: object
  dto.UserDTO:
    properties:
      id:
        type: integer
      nickname:
        type: string
      role_id:
        type: integer
      username:
        type: string
    type: object
  dto.UserInfoResp:
    properties:
      menus:
        items:
          $ref: '#/definitions/model.Menu'
        type: array
      permissions:
        items:
          type: string
        type: array
      user:
        $ref: '#/definitions/dto.UserDTO'
    type: object
  handler.SaveConfigReq:
    properties:
      copyright:
        type: string
      oss_access_key:
        type: string
      oss_bucket:
        type: string
      oss_domain:
        type: string
      oss_endpoint:
        type: string
      oss_secret_key:
        type: string
      site_desc:
        type: string
      site_name:
        type: string
    type: object
  model.Menu:
    properties:
      children:
        items:
          $ref: '#/definitions/model.Menu'
        type: array
      create_time:
        type: string
      id:
        type: integer
      menu_name:
        type: string
      menu_type:
        description: 1目录 2页面 3按钮
        type: integer
      parent_id:
        type: integer
      path:
        type: string
      perms:
        type: string
      sort:
        type: integer
      status:
        type: integer
      update_time:
        type: string
    type: object
  response.Response:
    properties:
      code:
        description: 业务错误码
        type: integer
      data:
        description: 响应数据，无数据时为 null
      msg:
        description: 提示信息
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: 博客后台管理系统 API 文档
  title: Blog Admin API
  version: "1.0"
paths:
  /api/article/{id}:
    delete:
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 逻辑删除文章
      tags:
      - 文章管理
  /api/article/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: 文章信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - 文章管理
  /api/article/es/rebuild:
    post:
      description: 仅超级管理员可用，全量从PG同步到ES
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 手动重建ES全量索引
      tags:
      - 文章管理
  /api/article/es/search:
    get:
      parameters:
      - description: 搜索关键词
        in: query
        name: keyword
        required: true
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: ES全文搜索文章
      tags:
      - 文章管理
  /api/article/page:
    get:
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 分类ID
        in: query
        name: category_id
        type: integer
      - description: 状态 0草稿 1已发布
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 文章分页列表
      tags:
      - 文章管理
  /api/article/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: 文章信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新文章
      tags:
      - 文章管理
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 账号密码登录，返回 JWT token
      parameters:
      - description: 登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 认证
  /api/auth/logout:
    post:
      description: 清除 Redis 中的 token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /api/auth/userinfo:
    get:
      description: 返回当前用户信息、菜单树、权限标识
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserInfoResp'
              type: object
      security:
      - BearerAuth: []
      summary: 获取用户信息
      tags:
      - 认证
  /api/category/{id}:
    delete:
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 分类被引用禁止删除
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除分类
      tags:
      - 分类管理
  /api/category/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: 分类信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 新增分类
      tags:
      - 分类管理
  /api/category/tree:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取分类树
      tags:
      - 分类管理
  /api/category/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: 分类信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新分类
      tags:
      - 分类管理
  /api/menu/list:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取全部菜单树
      tags:
      - RBAC权限
  /api/role/{id}:
    delete:
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除角色
      tags:
      - RBAC权限
  /api/role/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: 角色信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRoleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建角色
      tags:
      - RBAC权限
  /api/role/list:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 角色列表
      tags:
      - RBAC权限
  /api/role/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: 角色信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRoleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新角色
      tags:
      - RBAC权限
  /api/site/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取站点配置
      tags:
      - 站点管理
    put:
      consumes:
      - application/json
      parameters:
      - description: 站点配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SaveConfigReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 保存站点配置
      tags:
      - 站点管理
  /api/site/testOss:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: OSS连通测试
      tags:
      - 站点管理
  /api/upload/oss:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 上传文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 上传文件到OSS
      tags:
      - 文件管理
  /api/user/{id}:
    delete:
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户管理
  /api/user/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户管理
  /api/user/page:
    get:
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 用户分页列表
      tags:
      - 用户管理
  /api/user/resetPwd/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新密码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPwdReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 重置密码
      tags:
      - 用户管理
  /api/user/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: 用户信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 编辑用户
      tags:
      - 用户管理
securityDefinitions:
  BearerAuth:
    description: 输入 Bearer {token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
