basePath: /
definitions:
  dto.ChangePwdReq:
    properties:
      new_password:
        maxLength: 32
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.CreateArticleReq:
    properties:
      category_id:
        type: integer
      content:
        type: string
      cover:
        type: string
      is_repost:
        description: 0原创 1转载
        type: integer
      published_at:
        description: 可选，格式 "2006-01-02 15:04:05"，未传则默认当前时间
        type: string
      repost_author:
        description: 原作者
        type: string
      repost_url:
        description: 原文链接（转载时必填）
        type: string
      status:
        type: integer
      tags:
        type: string
      title:
        type: string
    required:
    - category_id
    - content
    - title
    type: object
  dto.CreateCategoryReq:
    properties:
      image:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        type: integer
    required:
    - name
    type: object
  dto.CreateMenuReq:
    properties:
      menu_name:
        type: string
      menu_type:
        description: 1目录 2页面 3按钮
        enum:
        - 1
        - 2
        - 3
        type: integer
      parent_id:
        type: integer
      path:
        type: string
      perms:
        type: string
      sort:
        type: integer
      status:
        type: integer
    required:
    - menu_name
    - menu_type
    type: object
  dto.CreateRoleReq:
    properties:
      button_perms:
        description: 按钮权限标识数组
        items:
          type: string
        type: array
      menu_ids:
        description: 菜单ID数组
        items:
          type: integer
        type: array
      role_name:
        type: string
    required:
    - role_name
    type: object
  dto.CreateSiteLinkReq:
    properties:
      description:
        type: string
      icon:
        type: string
      name:
        type: string
      sort:
        type: integer
      status:
        type: integer
      url:
        type: string
    required:
    - name
    - url
    type: object
  dto.CreateUserReq:
    properties:
      nickname:
        type: string
      password:
        type: string
      role_id:
        type: integer
      status:
        type: integer
      username:
        type: string
    required:
    - password
    - role_id
    - username
    type: object
  dto.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResp:
    properties:
      token:
        type: string
    type: object
  dto.ProfileDTO:
    properties:
      avatar:
        type: string
      bio:
        type: string
      id:
        type: integer
      nickname:
        type: string
      role_id:
        type: integer
      username:
        type: string
    type: object
  dto.ResetPwdReq:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  dto.SaveSiteProfileReq:
    properties:
      avatar:
        type: string
      bio:
        type: string
      contacts:
        $ref: '#/definitions/dto.SiteProfileContact'
      name:
        type: string
      projects:
        items:
          $ref: '#/definitions/dto.SiteProfileProject'
        type: array
      skills:
        items:
          $ref: '#/definitions/dto.SiteProfileSkill'
        type: array
      title:
        type: string
    type: object
  dto.SiteLinkItem:
    properties:
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      sort:
        type: integer
      url:
        type: string
    type: object
  dto.SiteProfileContact:
    properties:
      address:
        description: 地址
        type: string
      email:
        description: 邮箱
        type: string
      github:
        description: GitHub 地址
        type: string
      qq:
        description: QQ 号
        type: string
      wechat:
        description: 微信号
        type: string
    type: object
  dto.SiteProfileProject:
    properties:
      desc:
        description: 项目描述
        type: string
      end:
        description: 结束时间，空表示至今
        type: string
      link:
        description: 项目链接
        type: string
      name:
        description: 项目名称
        type: string
      start:
        description: 开始时间 如 2026-01
        type: string
      tech:
        description: 技术栈
        items:
          type: string
        type: array
    type: object
  dto.SiteProfileResp:
    properties:
      avatar:
        description: 头像
        type: string
      bio:
        description: 个人简历/自序
        type: string
      contacts:
        allOf:
        - $ref: '#/definitions/dto.SiteProfileContact'
        description: 联系方式
      name:
        description: 站长姓名
        type: string
      projects:
        description: 项目经历列表
        items:
          $ref: '#/definitions/dto.SiteProfileProject'
        type: array
      skills:
        description: 技能列表
        items:
          $ref: '#/definitions/dto.SiteProfileSkill'
        type: array
      title:
        description: 头衔/一句话介绍
        type: string
    type: object
  dto.SiteProfileSkill:
    properties:
      group:
        description: 分组（如 后端/前端/工程化）
        type: string
      level:
        description: 熟练度 0-100
        type: integer
      name:
        description: 技能名称
        type: string
    type: object
  dto.SiteStatsResp:
    properties:
      article_count:
        description: 文章总数（未删除）
        type: integer
      category_count:
        description: 分类数
        type: integer
      founded_at:
        description: 建站日期
        type: string
      running_days:
        description: 运行天数
        type: integer
      user_count:
        description: 用户数
        type: integer
    type: object
  dto.UpdateArticleReq:
    properties:
      category_id:
        type: integer
      content:
        type: string
      cover:
        type: string
      id:
        type: integer
      is_repost:
        description: 0原创 1转载
        type: integer
      published_at:
        description: 可选，格式 "2006-01-02 15:04:05"，传了才更新
        type: string
      repost_author:
        description: 原作者
        type: string
      repost_url:
        description: 原文链接（转载时必填）
        type: string
      status:
        type: integer
      tags:
        type: string
      title:
        type: string
    required:
    - category_id
    - content
    - id
    - title
    type: object
  dto.UpdateCategoryReq:
    properties:
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        type: integer
    required:
    - id
    - name
    type: object
  dto.UpdateMenuReq:
    properties:
      id:
        type: integer
      menu_name:
        type: string
      menu_type:
        type: integer
      parent_id:
        type: integer
      path:
        type: string
      perms:
        type: string
      sort:
        type: integer
      status:
        type: integer
    required:
    - id
    type: object
  dto.UpdateProfileReq:
    properties:
      avatar:
        type: string
      bio:
        type: string
      nickname:
        type: string
    type: object
  dto.UpdateRoleReq:
    properties:
      button_perms:
        description: 按钮权限标识数组
        items:
          type: string
        type: array
      id:
        type: integer
      menu_ids:
        description: 菜单ID数组
        items:
          type: integer
        type: array
      role_name:
        type: string
    required:
    - id
    - role_name
    type: object
  dto.UpdateSiteLinkReq:
    properties:
      description:
        type: string
      icon:
        type: string
      name:
        type: string
      sort:
        type: integer
      status:
        type: integer
      url:
        type: string
    required:
    - name
    - url
    type: object
  dto.UpdateUserReq:
    properties:
      id:
        type: integer
      nickname:
        type: string
      role_id:
        type: integer
      status:
        type: integer
    required:
    - id
    type: object
  dto.UpdateUserStatusReq:
    properties:
      status:
        type: integer
    type: object
  dto.UserDTO:
    properties:
      avatar:
        type: string
      id:
        type: integer
      nickname:
        type: string
      role_id:
        type: integer
      username:
        type: string
    type: object
  dto.UserInfoResp:
    properties:
      menus:
        items:
          $ref: '#/definitions/model.Menu'
        type: array
      permissions:
        items:
          type: string
        type: array
      user:
        $ref: '#/definitions/dto.UserDTO'
    type: object
  handler.SaveConfigReq:
    properties:
      copyright:
        type: string
      founded_at:
        type: string
      icp:
        type: string
      oss_access_key:
        type: string
      oss_bucket:
        type: string
      oss_domain:
        type: string
      oss_endpoint:
        type: string
      oss_insecure:
        type: integer
      oss_provider:
        type: string
      oss_region:
        type: string
      oss_secret_key:
        type: string
      police_icp:
        type: string
      site_desc:
        type: string
      site_name:
        type: string
    type: object
  model.Menu:
    properties:
      children:
        items:
          $ref: '#/definitions/model.Menu'
        type: array
      create_time:
        type: string
      id:
        type: integer
      menu_name:
        type: string
      menu_type:
        description: 1目录 2页面 3按钮
        type: integer
      parent_id:
        type: integer
      path:
        type: string
      perms:
        type: string
      sort:
        type: integer
      status:
        type: integer
      update_time:
        type: string
    type: object
  model.SiteLink:
    properties:
      create_time:
        type: string
      description:
        description: 可选描述
        type: string
      icon:
        description: 图标图片 URL
        type: string
      id:
        type: integer
      name:
        description: 网站名称
        type: string
      sort:
        description: 排序，小靠前
        type: integer
      status:
        description: 1 启用 0 停用
        type: integer
      update_time:
        type: string
      url:
        description: 链接地址
        type: string
    type: object
  response.Response:
    properties:
      code:
        description: 业务错误码
        type: integer
      data:
        description: 响应数据，无数据时为 null
      msg:
        description: 提示信息
        type: string
    type: object
  service.SystemOverview:
    properties:
      app_mode:
        type: string
      app_name:
        type: string
      app_version:
        type: string
      db_status:
        type: string
      es_status:
        type: string
      go_version:
        type: string
      goroutines:
        type: integer
      mem_alloc_mb:
        type: integer
      redis_status:
        type: string
      uptime:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: 博客后台管理系统 API 文档
  title: Blog Admin API
  version: "1.0"
paths:
  /api/article/{id}:
    delete:
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 逻辑删除文章
      tags:
      - 文章管理
  /api/article/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: 文章信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - 文章管理
  /api/article/es/rebuild:
    post:
      description: 仅超级管理员可用，全量从PG同步到ES
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 手动重建ES全量索引
      tags:
      - 文章管理
  /api/article/es/search:
    get:
      parameters:
      - description: 搜索关键词
        in: query
        name: keyword
        required: true
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: ES全文搜索文章
      tags:
      - 文章管理
  /api/article/page:
    get:
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 分类ID
        in: query
        name: category_id
        type: integer
      - description: 状态 0草稿 1已发布
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 文章分页列表
      tags:
      - 文章管理
  /api/article/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: 文章信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新文章
      tags:
      - 文章管理
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 账号密码登录，返回 JWT token
      parameters:
      - description: 登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 认证
  /api/auth/logout:
    post:
      description: 清除 Redis 中的 token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /api/auth/userinfo:
    get:
      description: 返回当前用户信息、菜单树、权限标识
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserInfoResp'
              type: object
      security:
      - BearerAuth: []
      summary: 获取用户信息
      tags:
      - 认证
  /api/category/{id}:
    delete:
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 分类被引用禁止删除
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除分类
      tags:
      - 分类管理
  /api/category/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: 分类信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 新增分类
      tags:
      - 分类管理
  /api/category/tree:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取分类树
      tags:
      - 分类管理
  /api/category/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: 分类信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新分类
      tags:
      - 分类管理
  /api/menu/{id}:
    delete:
      parameters:
      - description: 菜单ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除菜单
      tags:
      - RBAC权限
  /api/menu/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: 菜单信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMenuReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建菜单
      tags:
      - RBAC权限
  /api/menu/list:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取全部菜单树
      tags:
      - RBAC权限
  /api/menu/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: 菜单信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMenuReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新菜单
      tags:
      - RBAC权限
  /api/profile/info:
    get:
      description: 返回当前登录用户的昵称、头像、个人简介等信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProfileDTO'
              type: object
      security:
      - BearerAuth: []
      summary: 获取个人信息
      tags:
      - 个人信息
  /api/profile/update:
    put:
      consumes:
      - application/json
      description: 更新当前登录用户的昵称、头像、个人简介，更新后清除用户缓存
      parameters:
      - description: 个人信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProfileDTO'
              type: object
      security:
      - BearerAuth: []
      summary: 更新个人信息
      tags:
      - 个人信息
  /api/public/article/{id}:
    get:
      description: 博客前台公开接口，根据 ID 获取已发布文章详情（含 content）
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 前台文章详情（仅已发布）
      tags:
      - 博客公开接口
  /api/public/article/dates:
    get:
      description: 博客前台公开接口，返回指定年月内有已发布文章的日期列表（YYYY-MM-DD）
      parameters:
      - description: 年份
        in: query
        name: year
        required: true
        type: integer
      - description: 月份 1-12
        in: query
        name: month
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 前台文章发布日历（指定年月）
      tags:
      - 博客公开接口
  /api/public/article/es/search:
    get:
      description: 博客前台公开接口，仅搜索已发布文章，ES 不可用时降级 PG LIKE
      parameters:
      - description: 搜索关键词
        in: query
        name: keyword
        required: true
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: page_size
